<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart - PCBuildist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-info" href="index.html">PCBUILDIST</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="build.html">Build a PC</a></li>
        <li class="nav-item"><a class="nav-link active" href="cart.html">Cart</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Cart Section -->
<div class="container my-5">
  <h2 class="mb-4 fw-bold text-center">Your Cart</h2>
  
  <div class="table-responsive">
    <table class="table table-striped table-bordered bg-white shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>Item</th>
          <th>Category</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <!-- Items will be dynamically added here -->
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-end mt-3">
    <h5 class="me-3">Grand Total: $<span id="grandTotal">0</span></h5>
    <button class="btn btn-info">Checkout</button>
  </div>
</div>

<script>
  // Example cart items (you can dynamically add from build.html later)
  const cartItems = [
    { name: 'Intel Core i9', category: 'Processor', price: 500, quantity: 1 },
    { name: 'NVIDIA RTX 4090', category: 'Graphics Card', price: 1600, quantity: 1 },
  ];

  const cartTable = document.getElementById('cart-items');
  const grandTotalElem = document.getElementById('grandTotal');

  function renderCart() {
    cartTable.innerHTML = '';
    let grandTotal = 0;

    cartItems.forEach((item, index) => {
      const total = item.price * item.quantity;
      grandTotal += total;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${item.name}</td>
        <td>${item.category}</td>
        <td>$${item.price}</td>
        <td><input type="number" class="form-control" value="${item.quantity}" min="1" style="width:80px;" onchange="updateQuantity(${index}, this.value)"></td>
        <td>$${total}</td>
        <td><button class="btn btn-danger btn-sm" onclick="removeItem(${index})"><i class="bi bi-trash"></i></button></td>
      `;
      cartTable.appendChild(row);
    });

    grandTotalElem.textContent = grandTotal;
  }

  function updateQuantity(index, value) {
    cartItems[index].quantity = parseInt(value);
    renderCart();
  }

  function removeItem(index) {
    cartItems.splice(index, 1);
    renderCart();
  }

  renderCart();
</script>

</body>
</html>
