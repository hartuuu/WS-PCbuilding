</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #00142e, #003b92);">
  <div class="container">
    <a class="navbar-brand" href="">
      <img src="Images/logo.png" alt="PCBuildist Logo" height="40">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="build.html">Build a PC</a></li>
      </ul>
    </div>
    <div class="d-flex">
      <a href="tracker.html" class="nav-link text-light me-3"><i class="bi bi-truck fs-5"></i></a>
      <a href="saved.html" class="nav-link text-light me-3"><i class="bi bi-bookmark fs-5"></i></a>
      <a href="cart.html" class="nav-link text-light me-3"><i class="bi bi-cart fs-5"></i></a>
      <a class="nav-link text-light"><i class="bi bi-person-circle fs-5"></i></a>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h2 class="mb-4 fw-bold text-center text-light">Your Cart</h2>

  <div class="table-responsive">
    <table class="table table-striped table-bordered bg-white shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>Image</th>
          <th>Item</th>
          <th>Category</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="cart-items">
        <tr>
          <td>
            <img src="Images/5600X.webp" width="70" class="rounded">
          </td>
          <td>Ryzen 5 5600X</td>
          <td>Processor</td>
          <td>₱6,244</td>
          <td>1</td>
          <td>₱6,244</td>
          <td>
            <button class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td>
            <img src="Images/RTX.jpg" width="70" class="rounded">
          </td>
          <td>NVIDIA RTX 4070</td>
          <td>Graphics Card</td>
          <td>₱42,799</td>
          <td>1</td>
          <td>₱42,799</td>
          <td>
            <button class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
          </td>
        </tr>

      </tbody>
    </table>

  <div class="d-flex justify-content-end mt-3">
    <h5 class="me-3">Grand Total: ₱49,043</h5>
    <button class="btn btn-info">Checkout</button>
  </div>
