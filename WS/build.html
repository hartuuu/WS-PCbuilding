<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build a PC - PCBuildist</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-info" href="index.html">PCBUILDIST</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="build.html">Build a PC</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Build PC Section -->
<div class="container my-5">
  <h2 class="text-center mb-4 fw-bold">Build Your PC</h2>
  <p class="text-center mb-5">Select your components and see your custom PC configuration.</p>

  <div class="row g-4">
    <!-- CPU Selection -->
    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Processor</h5>
          <select class="form-select">
            <option selected>Select CPU</option>
            <option>Intel Core i9</option>
            <option>Intel Core i7</option>
            <option>AMD Ryzen 9</option>
            <option>AMD Ryzen 7</option>
          </select>
        </div>
      </div>
    </div>

    <!-- GPU Selection -->
    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Graphics Card</h5>
          <select class="form-select">
            <option selected>Select GPU</option>
            <option>NVIDIA RTX 4090</option>
            <option>NVIDIA RTX 4080</option>
            <option>AMD Radeon RX 7900</option>
            <option>AMD Radeon RX 7800</option>
          </select>
        </div>
      </div>
    </div>

    <!-- RAM Selection -->
    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Memory (RAM)</h5>
          <select class="form-select">
            <option selected>Select RAM</option>
            <option>16 GB</option>
            <option>32 GB</option>
            <option>64 GB</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Storage Selection -->
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Storage</h5>
          <select class="form-select">
            <option selected>Select Storage</option>
            <option>512 GB SSD</option>
            <option>1 TB SSD</option>
            <option>2 TB SSD</option>
            <option>2 TB HDD</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Power Supply -->
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Power Supply</h5>
          <select class="form-select">
            <option selected>Select PSU</option>
            <option>650W</option>
            <option>750W</option>
            <option>850W</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <div class="col-12 text-center mt-4">
      <button class="btn btn-info btn-lg">Build My PC</button>
    </div>
  </div>
</div>

</body>
</html>
