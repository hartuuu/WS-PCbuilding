<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processor Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #00142e, #003b92);">
  <div class="container">
    <a class="navbar-brand" href="">
      <img src="Images/logo.png" alt="PCBuildist Logo" height="40">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="build.html">Build a PC</a></li>
      </ul>

      <form class="d-flex me-3 w-50" role="search">
        <input class="form-control me-2 rounded-pill w-100" type="search" placeholder="Search components...">
        <button class="btn btn-outline-info" type="submit">Search</button>
      </form>

      <div class="d-flex align-items-center">
        <a href="tracker.html" class="nav-link text-light me-3"><i class="bi bi-truck fs-5"></i></a>
        <a href="saved.html" class="nav-link text-light me-3"><i class="bi bi-bookmark fs-5"></i></a>
        <a href="cart.html" class="nav-link text-light me-3"><i class="bi bi-cart fs-5"></i></a>
        <a class="nav-link text-light fs-5" data-bs-toggle="offcanvas" data-bs-target="#offcanvasLogin">
          <i class="bi bi-person-circle"></i>
        </a>
      </div>
</nav>


<div class="container py-5">
  <h2 class="text-center mb-5 text-light">Processors</h2>
  <div class="row g-4 justify-content-center">
    <div class="col-6 col-md-4 col-lg-3">
    <div class="processor-card text-center" data-bs-toggle="modal" data-bs-target="#processorModal" 
    data-name="AMD Ryzen 5 5600G" data-description="Socket AM4, 6-Core 12-Thread, 3.9GHz, Vega 7 Graphics" data-price="₱6,800" data-image="Images/5600G.jpg">
    <img src="Images/5600G.jpg" alt="AMD Ryzen 5 5600G">
    <h5 class="mt-2">AMD Ryzen 5 5600G</h5>
    </div>
    </div>
<div class="col-6 col-md-4 col-lg-3">
    <div class="processor-card text-center" data-bs-toggle="modal" data-bs-target="#processorModal" 
    data-name="AMD Ryzen 5 5600X" data-description="6-Core 12-Thread, 3.7GHz, Wraith Stealth Cooler" data-price="₱5,295" data-image="Images/5600X.webp">
    <img src="Images/5600X.webp" alt="AMD Ryzen 5 5600X">
    <h5 class="mt-2">AMD Ryzen 5 5600X</h5>
    </div>
    </div>
<div class="col-6 col-md-4 col-lg-3">
    <div class="processor-card text-center" data-bs-toggle="modal" data-bs-target="#processorModal" 
    data-name="AMD Ryzen 7 5700X" data-description="8-Core 16-Thread, 3.4GHz, Wraith Stealth Cooler" data-price="₱6,395" data-image="Images/5700X.jpg">
    <img src="Images/5700X.jpg" alt="AMD Ryzen 7 5700X">
    <h5 class="mt-2">AMD Ryzen 7 5700X</h5>
    </div>
</div>
 
  </div>
</div>

<div class="modal fade" id="processorModal" tabindex="-1" aria-labelledby="processorModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white">
    <div class="modal-header" style="border-bottom:none;">
    <h5 class="modal-title " id="processorModalLabel">Processor Name</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body text-center">
    <img id="processorImage" src="" alt="Processor Image" style="width:120px; height:120px; border-radius:8px;" class="mb-3">
    <p id="processorDescription"></p>
    <h5 id="processorPrice"></h5>
    <div class="d-flex gap-3 mt-4 justify-content-center">
    <button class="btn btn-cart w-50"><i class="bi bi-cart-plus"></i> Add to Cart</button>
    <button class="btn btn-save w-50"><i class="bi bi-bookmark"></i> Save</button>
    </div>
    </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
